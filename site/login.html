<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Martha Iradukunda</title>
  <meta name="description" content="Sign in to manage the portfolio.">
  <meta property="og:title" content="Sign in · Martha Iradukunda">
  <meta property="og:description" content="Sign in to manage the portfolio.">
  <meta property="og:image" content="https://martha-iradukunda-brand.netlify.app/img/founder2.jpg">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2f2f31">
  <link rel="icon" href="/img/mylogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Ubuntu:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=2339289">
  <script type="module" src="/js/site.js?v=2339289"></script>
  <meta name="robots" content="noindex">
</head>
<body data-page="login">
<main class="login-page" id="main">
  <form class="login-card" data-login-form novalidate>
    <a href="/" style="display:inline-block;margin-bottom:18px"><img src="/img/mylogo.png" alt="Martha I logo" width="70" height="55" style="border-radius:4px"></a>
    <h1>Login here</h1>
    <p class="small" style="color:#ccc;margin-bottom:22px">Only the site owner signs in here, to manage the résumé, blogs and messages.</p>
    <div data-form-notice></div>
    <div class="field"><label for="l-email">Email</label><input type="email" id="l-email" name="email" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">Password</label><input type="password" id="l-pass" name="password" autocomplete="current-password" required></div>
    <label class="check" style="margin-bottom:20px"><input type="checkbox" data-show-password> Show password</label>
    <button class="btn" type="submit" style="width:100%"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    <p class="small" style="margin:22px 0 0;text-align:center"><a href="/">← Back to the website</a></p>
  </form>
</main>
</body>
</html>
